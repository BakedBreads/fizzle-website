<svg xmlns="http://www.w3.org/2000/svg" viewBox="-275.14 -340 455.96 500" width="455.96" height="500"><style>
.hov { animation: hover 2.6s ease-in-out 0s infinite; }
@keyframes hover { 50% { transform: translateY(-5px); } }
.body, .head, .wbk, .wfr, .sp, .pt, .dot, .hn, .eye, .flap, .sb, .rb { transform-box: fill-box; transform-origin: center; }
.hn, .flap { transform-origin: 50% 100%; }
.flap { animation: flap 3s ease-in-out 0.4s infinite; }
@keyframes flap { 0%, 78%, 100% { transform: none; } 82% { transform: scaleY(.78); } 86% { transform: none; } 90% { transform: scaleY(.84); } 94% { transform: none; } }
.eye { animation: blink 4.2s 0.8s infinite; }
@keyframes blink { 0%, 93%, 100% { transform: none; } 96% { transform: scaleY(.1); } }
.sb { animation: bob 1.5s ease-in-out infinite; }
.sb1 { animation-duration: 2s; animation-delay: -.7s; }
.sb2 { animation-duration: 1s; animation-delay: -.3s; }
@keyframes bob { 25% { transform: translate(1.6px, -1.2px) scale(1.05); } 75% { transform: translate(-1.4px, 1.2px) scale(.96); } }
.rb { opacity: 0; animation: rise 1.5s linear infinite; }
@keyframes rise { 0% { transform: translate(0px, 0px) scale(0); opacity: 1; } 7% { transform: translate(0px, 0px) scale(0.44); opacity: 1; } 14% { transform: translate(-0.47px, -0.06px) scale(0.51); opacity: 1; } 22% { transform: translate(-4.03px, -3.54px) scale(0.56); opacity: 1; } 30% { transform: translate(-6.66px, -11.19px) scale(0.6); opacity: 1; } 38% { transform: translate(-5.13px, -21.95px) scale(0.65); opacity: 1; } 46% { transform: translate(-7.08px, -35.05px) scale(0.69); opacity: 1; } 54% { transform: translate(-16.07px, -49.89px) scale(0.74); opacity: 1; } 62% { transform: translate(-19.68px, -66.03px) scale(0.78); opacity: 1; } 70% { transform: translate(-13.02px, -83.14px) scale(0.83); opacity: 1; } 78% { transform: translate(-13.59px, -100.99px) scale(0.88); opacity: 1; } 86% { transform: translate(-25.24px, -119.37px) scale(0.92); opacity: 1; } 90% { transform: translate(-29.7px, -128.73px) scale(1.14); opacity: 0.58; } 94% { transform: translate(-30.56px, -138.17px) scale(1.39); opacity: 0.13; } 100% { transform: translate(-26px, -152.47px) scale(1.5); opacity: 0; } }

