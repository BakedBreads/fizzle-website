<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fizzle — Sweetened by bees. (design mockup)</title>
<meta name="description" content="Website design mockup for Fizzle, a fruit soda sweetened with real honey. A school brand project, not a real shop.">
<link rel="icon" href="img/icon.svg">
<style>
@font-face { font-family: Poppins; font-weight: 400; src: url(fonts/poppins-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 500; src: url(fonts/poppins-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 600; src: url(fonts/poppins-latin-600-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 700; src: url(fonts/poppins-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Poppins; font-weight: 800; src: url(fonts/poppins-latin-800-normal.woff2) format('woff2'); }
:root {
  --orange: #FF8A1F; --orange-d: #F07812; --bee: #3A1B0B; --honey: #FFC233; --green: #3FBF5F;
  --cream: #FFF4DC; --paper: #FFFBF2; --line: 2px solid var(--bee); --shadow: 5px 5px 0 var(--bee);
  --wrap: 1200px; --gap: 24px; --r: 18px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: Poppins, system-ui, sans-serif; color: var(--bee); background: var(--cream); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle, #F2DDB2 1.6px, transparent 1.8px) 0 0 / 28px 28px; opacity: .55; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 32px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
h1, h2, h3 { margin: 0; line-height: 1.05; letter-spacing: -.02em; }
h2 { font-size: 44px; font-weight: 800; }
.card { background: #fff; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* the notice that this is a mockup */
.mock { background: var(--bee); color: var(--cream); font-size: 13px; text-align: center; padding: 8px 16px; }
.mock b { color: var(--honey); font-weight: 700; }

/* header */
header { position: sticky; top: 0; z-index: 20; background: var(--orange); border-bottom: var(--line); }
.bar { display: flex; align-items: center; gap: 28px; height: 78px; }
.bar .logo img { height: 60px; width: auto; }
nav { display: flex; gap: 26px; margin-left: auto; font-weight: 600; font-size: 15px; }
nav a { text-decoration: none; padding: 4px 0; border-bottom: 2px solid transparent; }
nav a:hover { border-color: var(--bee); }
.lang { display: flex; border: var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
.lang button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 700; }
.lang button[aria-pressed="true"] { background: var(--bee); color: var(--cream); }
.cartbtn { position: relative; display: grid; place-items: center; width: 46px; height: 46px; border: var(--line); border-radius: 14px; background: #fff; box-shadow: 3px 3px 0 var(--bee); transition: transform .15s, box-shadow .15s; }
.cartbtn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--bee); }
.cartbtn svg { width: 24px; height: 24px; }
.count { position: absolute; top: -9px; right: -9px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--bee); color: var(--cream); font-size: 12px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bee); }
.count:empty, .count[data-n="0"] { display: none; }
.count.bump { animation: bump .4s cubic-bezier(.25, 1, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.25); } 100% { transform: scale(1); } }
.menubtn { display: none; }

/* hero */
.hero { padding: 64px 0 72px; }
.hero .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
.hero h1 { font-size: 76px; font-weight: 800; margin: 14px 0 18px; }
.hero h1 .hl { color: var(--orange-d); }
.hero p.lead { font-size: 19px; max-width: 30em; margin: 0 0 26px; }
.price { display: flex; align-items: baseline; gap: 10px; margin-bottom: 22px; }
.price strong { font-size: 34px; font-weight: 800; }
.price span { font-weight: 500; opacity: .75; }
.field { margin-bottom: 18px; }
.field > .lbl { display: block; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
.packs { display: flex; gap: 10px; flex-wrap: wrap; }
.pack { border: var(--line); border-radius: 14px; background: #fff; padding: 10px 16px; text-align: left; line-height: 1.25; min-width: 130px; transition: background .15s, transform .15s; }
.pack small { display: block; font-weight: 500; opacity: .75; }
.pack span { font-weight: 700; }
.pack[aria-pressed="true"] { background: var(--honey); box-shadow: 3px 3px 0 var(--bee); transform: translate(-1px, -1px); }
.buyrow { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; }
.qty { display: flex; align-items: center; border: var(--line); border-radius: 14px; background: #fff; overflow: hidden; }
.qty button { width: 44px; height: 52px; border: 0; background: none; font-size: 22px; font-weight: 600; }
.qty button:hover { background: var(--cream); }
.qty output { min-width: 34px; text-align: center; font-weight: 700; font-size: 18px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 56px; padding: 0 26px; border: var(--line); border-radius: 14px; font-weight: 700; font-size: 17px; box-shadow: 4px 4px 0 var(--bee); transition: transform .15s, box-shadow .15s, background .2s; text-decoration: none; }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--bee); }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--bee); }
.btn.primary { background: var(--orange); }
.btn.dark { background: var(--bee); color: var(--cream); box-shadow: 4px 4px 0 var(--orange-d); }
.btn.added { background: var(--green); }
.btn svg { width: 20px; height: 20px; }
.ticks { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 26px; font-weight: 600; font-size: 15px; }
.ticks span { display: flex; align-items: center; gap: 8px; }
.ticks i { width: 22px; height: 22px; border-radius: 50%; background: var(--honey); border: 2px solid var(--bee); display: grid; place-items: center; }
.ticks i::after { content: ''; width: 8px; height: 4px; border: solid var(--bee); border-width: 0 0 2.5px 2.5px; transform: rotate(-45deg) translate(1px, -1px); }
.shot { position: relative; }
.shot .card { overflow: hidden; aspect-ratio: 792 / 1000; }
.shot .card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 46%; }
.shot .beeimg { position: absolute; width: 92px; left: -38px; top: 38px; animation: fly 6s ease-in-out infinite; }
@keyframes fly { 0%, 100% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(10px, -14px) rotate(4deg); } }
.tag { position: absolute; right: -18px; bottom: 42px; background: var(--honey); color: var(--bee); border: var(--line); border-radius: 14px; padding: 10px 16px; font-weight: 700; box-shadow: var(--shadow); transform: rotate(3deg); }

/* sections */
section.block { padding: 72px 0; }
.head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
.head p { margin: 0; max-width: 26em; }
.gallery { display: grid; grid-template-columns: 1.4fr 1fr 1fr; grid-template-rows: auto auto; gap: var(--gap); }
.gallery figure { margin: 0; overflow: hidden; position: relative; }
.gallery figure img { width: 100%; height: 100%; object-fit: cover; }
.gallery figure:first-child { grid-row: span 2; }
.gallery figcaption { position: absolute; left: 14px; bottom: 14px; background: var(--cream); border: var(--line); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.gallery .g2, .gallery .g3 { aspect-ratio: 4 / 3.2; }
.gallery .g4 { grid-column: span 2; aspect-ratio: 16 / 7; }
.gallery .g4 img { object-position: 50% 40%; }

.inside { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
.feats { display: grid; gap: 18px; }
.feat { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; padding: 18px 20px; }
.feat .ic { width: 64px; height: 64px; border-radius: 16px; border: var(--line); display: grid; place-items: center; }
.feat h3 { font-size: 19px; font-weight: 700; margin-bottom: 2px; }
.feat p { margin: 0; font-size: 15px; }
.ingr { padding: 22px 24px; margin-top: 18px; font-size: 15px; }
.ingr b { display: block; margin-bottom: 4px; }
.nutri { padding: 26px 28px; }
.nutri h3 { font-size: 22px; font-weight: 800; padding-bottom: 12px; border-bottom: 8px solid var(--bee); margin-bottom: 4px; }
.nutri table { width: 100%; border-collapse: collapse; font-size: 16px; }
.nutri td { padding: 11px 0; border-bottom: 1.5px solid #D9D2C3; }
.nutri td:last-child { text-align: right; font-weight: 700; }
.nutri tr.big td { font-weight: 800; font-size: 18px; }
.nutri tr.sub td:first-child { padding-left: 18px; }
.nutri .note { font-size: 13px; opacity: .7; margin: 12px 0 0; }

.reviews { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gap); }
.review { padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.stars { color: var(--orange-d); letter-spacing: 2px; font-size: 18px; }
.review p { margin: 0; font-size: 16px; }
.review footer { margin-top: auto; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; border: var(--line); display: grid; place-items: center; font-weight: 800; }
.score { display: flex; align-items: center; gap: 12px; }
.score strong { font-size: 40px; font-weight: 800; }
.pill { display: inline-block; border: var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: #fff; }

.faqgrid { display: grid; grid-template-columns: 1fr 340px; gap: 32px; align-items: start; }
.faq { display: grid; gap: 14px; }
.ask { padding: 28px; background: var(--honey); text-align: left; }
.ask img { width: 96px; margin-bottom: 10px; }
.ask h3 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
.ask p { margin: 0 0 20px; }
.faq details { padding: 0; }
.faq summary { list-style: none; cursor: pointer; padding: 20px 24px; font-weight: 700; font-size: 18px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; font-size: 26px; line-height: 1; transition: transform .25s; }
.faq details[open] summary::after { transform: rotate(45deg); }
.faq details p { margin: 0; padding: 0 24px 22px; }

.contact { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: start; }
.contact .intro p { font-size: 18px; max-width: 26em; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cc { padding: 18px 20px; }
.cc .eyebrow { font-size: 11px; opacity: .7; }
.cc strong { display: block; font-size: 17px; font-weight: 700; white-space: nowrap; }
.cc.wide { grid-column: span 2; }
.cc a { text-decoration: none; }
.cc a:hover { text-decoration: underline; }

footer.site { background: var(--bee); color: var(--cream); margin-top: 40px; padding: 56px 0 30px; border-top: var(--line); }
.foot { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 32px; }
.foot .brand { background: var(--orange); border-radius: var(--r); padding: 22px 24px; border: 2px solid var(--cream); max-width: 380px; }
.foot .brand img { height: 84px; width: auto; }
.foot h4 { margin: 0 0 12px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--honey); }
.foot ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.foot a { text-decoration: none; opacity: .9; }
.foot a:hover { opacity: 1; text-decoration: underline; }
.legal { margin-top: 40px; padding-top: 20px; border-top: 1px solid rgba(255, 244, 220, .2); font-size: 13px; opacity: .8; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* cart drawer */
.scrim { position: fixed; inset: 0; background: rgba(58, 27, 11, .45); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--paper); border-left: var(--line); z-index: 41; display: flex; flex-direction: column; transform: translateX(100%); transition: transform .38s cubic-bezier(.2, .8, .2, 1); }
body.cart-open .scrim { opacity: 1; pointer-events: auto; }
body.cart-open .drawer { transform: none; }
.drawer header { position: static; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 78px; }
.drawer header h3 { font-size: 22px; font-weight: 800; }
.x { width: 40px; height: 40px; border: var(--line); border-radius: 12px; background: #fff; font-size: 20px; font-weight: 700; }
.items { flex: 1; overflow: auto; padding: 20px 24px; display: grid; gap: 14px; align-content: start; }
.empty { opacity: .7; }
.item { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 12px; }
.item img { width: 76px; height: 92px; object-fit: cover; border-radius: 10px; border: var(--line); }
.item h4 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.3; }
.item .meta { font-size: 14px; opacity: .75; }
.item .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.item .qty button { width: 34px; height: 36px; font-size: 18px; }
.item .qty output { min-width: 26px; font-size: 15px; }
.rm { border: 0; background: none; font-size: 13px; font-weight: 600; text-decoration: underline; opacity: .75; }
.sum { border-top: var(--line); padding: 20px 24px 24px; display: grid; gap: 14px; }
.sum .line { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; }
.sum .btn { width: 100%; }
.sum .notice { display: none; font-size: 14px; background: var(--honey); border: var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.sum .notice.show { display: block; }

/* the ad: a section with the film, and the same film as a pop-up with a Skip countdown */
.adcard { overflow: hidden; aspect-ratio: 16 / 9; background: #000; }
.adcard video { display: block; width: 100%; height: 100%; }
.adrow { display: flex; justify-content: center; margin-top: 24px; }
.adpop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(58, 27, 11, .62); opacity: 0; transition: opacity .25s; }
.adpop[hidden] { display: none; }
.adpop.show { opacity: 1; }
.adbox { position: relative; width: min(960px, 100%); background: #000; border: var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; transform: translateY(16px) scale(.98); transition: transform .35s cubic-bezier(.16, 1, .3, 1); }
.adpop.show .adbox { transform: none; }
.adtop { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--paper); border-bottom: var(--line); font-size: 14px; font-weight: 600; }
.adtop .badge { background: var(--honey); border-radius: 6px; padding: 1px 9px; font-weight: 700; }
.adtop .time { margin-left: auto; font-variant-numeric: tabular-nums; opacity: .75; }
.adstage { position: relative; aspect-ratio: 16 / 9; }
.adstage video { display: block; width: 100%; height: 100%; }
.adctl { position: absolute; left: 16px; right: 16px; bottom: 25px; display: flex; justify-content: space-between; gap: 12px; pointer-events: none; }
.adctl .adbtn { pointer-events: auto; }
.adbtn { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 16px; color: #fff; background: rgba(10, 10, 10, .72); border: 2px solid rgba(255, 255, 255, .4); }
.adbtn svg { width: 18px; height: 18px; }
#adskip[aria-disabled="true"] { opacity: .85; cursor: default; font-weight: 600; }
#adskip.ready { border-color: rgba(255, 255, 255, .9); }
#adskip.ready:hover { background: rgba(10, 10, 10, .9); }
#adsite { background: var(--orange); color: var(--bee); border-color: var(--bee); }
#adsound { position: absolute; top: 14px; right: 16px; height: 40px; padding: 0 14px; font-size: 14px; }
.adbar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, .3); }
.adbar i { display: block; height: 100%; width: 0; background: var(--honey); }
@media (max-width: 860px) {
  .adpop { padding: 12px; }
  .adctl { position: static; padding: 10px; background: var(--paper); border-top: var(--line); }
  .adbtn { height: 42px; font-size: 14px; padding: 0 14px; }
  #adskip { color: var(--cream); background: var(--bee); border-color: var(--bee); }
  #adsound { top: 8px; right: 8px; height: 32px; font-size: 12px; padding: 0 10px; }
}

/* the sticky buy bar on phones */
.stick { display: none; }

@media (max-width: 860px) {
  .wrap { padding: 0 18px; }
  nav, .bar .lang { display: none; }
  .bar { height: 64px; gap: 12px; }
  .bar .logo img { height: 40px; }
  .menubtn { display: grid; place-items: center; width: 42px; height: 42px; border: var(--line); border-radius: 12px; background: #fff; margin-left: auto; }
  .menubtn svg { width: 22px; }
  .cartbtn { width: 42px; height: 42px; }
  .mobilelang { display: flex !important; margin: 0 0 20px; width: max-content; }
  .hero { padding: 28px 0 40px; }
  .hero .grid { grid-template-columns: 1fr; gap: 28px; }
  .hero .shot { order: -1; }
  .shot .beeimg { width: 64px; left: -10px; top: 18px; }
  .tag { right: 10px; bottom: 18px; font-size: 14px; }
  .hero h1 { font-size: 46px; }
  .hero p.lead { font-size: 17px; }
  h2 { font-size: 32px; }
  .head { flex-direction: column; align-items: start; }
  section.block { padding: 44px 0; }
  .gallery { grid-template-columns: 1fr 1fr; }
  .gallery figure:first-child { grid-column: span 2; grid-row: auto; aspect-ratio: 4 / 4.4; }
  .gallery .g4 { grid-column: span 2; }
  .inside, .contact, .foot, .faqgrid { grid-template-columns: 1fr; }
  .cc.wide { grid-column: auto; }
  .reviews { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr; }
  .stick { display: flex; position: sticky; bottom: 0; z-index: 15; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; background: var(--paper); border-top: var(--line); }
  .stick strong { font-size: 18px; }
  .stick .btn { height: 48px; padding: 0 20px; font-size: 16px; }
}
.mobilelang { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="mock" data-i18n-html="mock"></div>

<header>
  <div class="wrap bar">
    <a class="logo" href="#top" aria-label="Fizzle"><img src="img/logo.svg" alt="Fizzle"></a>
    <nav>
      <a href="#shop" data-i18n="nav_shop"></a>
      <a href="#inside" data-i18n="nav_inside"></a>
      <a href="#reviews" data-i18n="nav_reviews"></a>
      <a href="#faq" data-i18n="nav_faq"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button><button data-lang="id" aria-pressed="false">ID</button>
    </div>
    <button class="menubtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <button class="cartbtn" data-open-cart data-i18n-label="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.2"/><circle cx="9.5" cy="20" r="1.3"/><circle cx="17.5" cy="20" r="1.3"/></svg>
      <span class="count" id="count">0</span>
    </button>
  </div>
</header>

<main id="top">
  <!-- hero: the product, its price, pack size, quantity, add to cart / buy now -->
  <section class="hero" id="shop">
    <div class="wrap grid">
      <div>
        <div class="lang mobilelang" role="group" aria-label="Language">
          <button data-lang="en" aria-pressed="true">EN</button><button data-lang="id" aria-pressed="false">ID</button>
        </div>
        <span class="eyebrow" data-i18n="eyebrow"></span>
        <h1 data-i18n-html="h1"></h1>
        <p class="lead" data-i18n="lead"></p>
        <div class="price"><strong id="price"></strong><span id="per"></span></div>
        <div class="field">
          <span class="lbl" data-i18n="pack"></span>
          <div class="packs" id="packs"></div>
        </div>
        <div class="field">
          <span class="lbl" data-i18n="qty"></span>
          <div class="buyrow">
            <div class="qty"><button data-q="-1" aria-label="−">−</button><output id="q">1</output><button data-q="1" aria-label="+">+</button></div>
            <button class="btn primary" id="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11.2a1.6 1.6 0 0 0 1.6 1.3h8.6a1.6 1.6 0 0 0 1.6-1.2L21 8H6.2"/></svg><span data-i18n="add"></span></button>
            <button class="btn dark" id="buy" data-i18n="buy"></button>

  const el = e.target.closest('button, [data-close-cart]');
  if (!el) return;
  if (el.dataset.lang) { lang = el.dataset.lang; render(); }
  else if (el.dataset.pack) { pack = PACKS.find(p => p.id === el.dataset.pack); render(); }
  else if (el.dataset.q) { qty = Math.max(1, Math.min(24, qty + +el.dataset.q)); render(); }
  else if (el.id === 'add' || el.id === 'sadd') add(false);
  else if (el.id === 'buy') add(true);
  else if (el.hasAttribute('data-open-cart')) openCart();
  else if (el.hasAttribute('data-close-cart')) closeCart();
  else if (el.dataset.cq) { const q = (cart.get(el.dataset.cq) || 0) + +el.dataset.d; q > 0 ? cart.set(el.dataset.cq, q) : cart.delete(el.dataset.cq); drawCart(); }
  else if (el.dataset.rm) { cart.delete(el.dataset.rm); drawCart(); }
  else if (el.id === 'checkout') $('#notice').classList.add('show');
  else if (el.id === 'adskip') { if (adReady()) closeAd(); }
  else if (el.id === 'adsound') { adVid.muted = !adVid.muted; if (adVid.paused) { const p = adVid.play(); if (p) p.catch(() => {}); } tickAd(); }
  else if (el.id === 'adsite') { closeAd(); $('#shop').scrollIntoView(); }
  else if (el.hasAttribute('data-open-ad')) openAd(false);
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (!adPop.hidden) { if (adReady()) closeAd(); } else closeCart(); });
// (for the screenshots: ?lang=id, ?cart=open, ?ad=0 (no pop-up), ?ad=open (the pop-up, still, skippable))
const qs = new URLSearchParams(location.search);
if (qs.get('lang') === 'id') lang = 'id';
render();
if (qs.get('cart') === 'open') {
  // (opened without the slide: a background tab does not run transitions)
  $('#drawer').style.transition = $('.scrim').style.transition = 'none';
  pack = PACKS[1]; qty = 1; add(false); pack = PACKS[0]; add(false); render(); openCart();
}
// the pop-up ad, once a visit, a moment after the page opens
if (qs.get('ad') === 'open') openAd(true);
else if (qs.get('ad') !== '0' && qs.get('cart') !== 'open') {
  let seen = false;
  try { seen = sessionStorage.getItem('fizzle-ad') === '1'; sessionStorage.setItem('fizzle-ad', '1'); } catch (e) { /* storage blocked: show it */ }
  if (!seen) setTimeout(() => openAd(false), 1500);
}
</script>
